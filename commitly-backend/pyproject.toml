[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
case_sensitive = false
known_first_party = ["app"]
known_third_party = [
  "alembic",
  "fastapi",
  "httpx",
  "jose",
  "pydantic",
  "pydantic_settings",
  "requests",
  "sqlalchemy",
  "starlette",
]
force_sort_within_sections = true
combine_as_imports = true

name: Commitly Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'commitly-backend/**'
      - '.github/workflows/commitly-backend-ci.yml'
  pull_request:
    paths:
      - 'commitly-backend/**'
      - '.github/workflows/commitly-backend-ci.yml'

jobs:
  lint:
    name: Lint (Flake8, Black, isort)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commitly-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('commitly-backend/requirements.txt', 'commitly-backend/requirements/dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-

      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flake8
        run: |
          echo "Running Flake8..."
          flake8 --version
          flake8 --verbose

      - name: Black (check)
        run: |
          echo "Running Black..."
          black --version
          black --check .

      - name: isort (check-only)
        run: |
          echo "Running isort..."
          isort --version
          isort --check-only --profile black .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: commitly-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('commitly-backend/requirements.txt', 'commitly-backend/requirements/test.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-

      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -q



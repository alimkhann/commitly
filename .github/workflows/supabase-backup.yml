name: Supabase Backups

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  dump:
    name: Nightly Supabase Backup
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: ci-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "SUPABASE_DB_URL secret is required" >&2
            exit 1
          fi
          bash commitly-backend/scripts/backup_supabase.sh "${OUTPUT_DIR}"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/*.sql
